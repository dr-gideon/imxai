projects:
  - name: RESOLVE
    former: formerly NORA
    status: Live in production
    cls: live
    summary: AI support-operations system that reads incoming email, decides the right service-desk action, and executes it after human approval. Live and used daily by internal support teams.
    stack:
      - Node.js
      - AWS LLM
      - Postgres
      - Microsoft Graph
      - ERP API

  - name: POC App
    status: Live in production
    cls: live
    summary: Warehouse proof-of-collection app for SAP Business One supplier returns, with digital courier signatures, signed PDFs, and SAP writeback. Live in production after customer acceptance.
    stack:
      - SAP B1 Service Layer
      - TypeScript
      - Fastify
      - SQL Server
      - PDFKit
    link: "https://www.youtube.com/watch?v=5NwqrQfRhWA"
    linkLabel: Watch demo
    screenshots:
      - src: /images/poc-app/fetch-document.png
        alt: POC App document lookup screen showing an SAP Business One A/P Credit Note
        caption: Fetch the supplier-return document directly from SAP Business One.
      - src: /images/poc-app/sign-document.png
        alt: POC App collection screen with courier details and digital signature capture
        caption: Capture courier details and a digital signature at collection.
      - src: /images/poc-app/pdf-proof.png
        alt: Signed proof-of-collection PDF generated by POC App
        caption: Generate a signed proof PDF and write the reference back to SAP.

  - name: Enterpryze MCP
    status: Public demo
    cls: demo
    summary: Hosted MCP server that lets AI clients work with Enterpryze sales-order data safely, with read and analysis tools, a guarded create flow, and bearer-protected access.
    stack:
      - MCP
      - TypeScript
      - Fastify
      - Cloudflare Tunnel

  - name: World Cup Sweepstake
    status: Shipped to real users
    cls: live
    summary: Office sweepstake app for the 2026 FIFA World Cup. 33 colleagues registered with their work email, drew a team through an AI-scripted dramatic reveal, and watched every draw land on a shared live reveal board.
    stack:
      - React
      - Vite
      - Express
      - SQLite
      - LLM
      - football-data.org API
    link: "https://github.com/dr-gideon/world-cup-sweepstake"
    linkLabel: View code
    screenshots:
      - src: /images/world-cup-sweepstake/entry-screen.png
        alt: World Cup Sweepstake entry screen with registration form and prize information
        caption: Verify a work email and enter the office sweepstake.
      - src: /images/world-cup-sweepstake/draw-reveal.png
        alt: World Cup Sweepstake draw screen revealing Brazil for a participant
        caption: Reveal each participant's team through the animated draw experience.
      - src: /images/world-cup-sweepstake/results-board-pots-1-2.png
        alt: World Cup Sweepstake results board showing assigned teams from pots one and two
        caption: Follow the shared results board for teams drawn from pots one and two.
      - src: /images/world-cup-sweepstake/results-board-pots-3-4.png
        alt: World Cup Sweepstake results board showing assigned teams from pots three and four
        caption: Follow the shared results board for teams drawn from pots three and four.
