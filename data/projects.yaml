projects:
  - name: RESOLVE
    former: formerly NORA
    status: Live in production
    cls: live
    summary: AI support-operations system that reads incoming email, decides the right service-desk action, and executes it after human approval. Live and used daily by internal support teams.
    stack:
      - Node.js
      - AWS LLM
      - Postgres
      - Microsoft Graph
      - ERP API

  - name: POC App
    status: In customer testing
    cls: staging
    summary: Warehouse proof-of-collection app for SAP Business One supplier returns, with digital courier signatures, signed PDFs, and SAP writeback. MVP accepted by a customer, now in active development.
    stack:
      - SAP B1 Service Layer
      - TypeScript
      - Fastify
      - SQL Server
      - PDFKit
    link: "https://www.youtube.com/watch?v=5NwqrQfRhWA"
    linkLabel: Watch demo

  - name: Enterpryze MCP
    status: Public demo
    cls: demo
    summary: Hosted MCP server that lets AI clients work with Enterpryze sales-order data safely, with read and analysis tools, a guarded create flow, and bearer-protected access.
    stack:
      - MCP
      - TypeScript
      - Fastify
      - Cloudflare Tunnel

  - name: World Cup Sweepstake
    status: Shipped to real users
    cls: live
    summary: Office sweepstake app for the 2026 FIFA World Cup. 33 colleagues registered with their work email, drew a team through an AI-scripted dramatic reveal, and watched every draw land on a shared live reveal board.
    stack:
      - React
      - Vite
      - Express
      - SQLite
      - LLM
      - football-data.org API
    link: "https://github.com/dr-gideon/world-cup-sweepstake"
    linkLabel: View code
